[project]
name = "shopping-assistant-api"
version = "0.1.0"
description = "Personal Shopping Assistant - natural language product recommendations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.37.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.0",
    "apify-client>=3.1.3",
    "httpx>=0.28.1",
    "anthropic>=1.0.0",
    "python-slugify>=8.0.4",
    "numpy>=2.5.2",
    "sentence-transformers>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "markdown>=3.10.3",
]
