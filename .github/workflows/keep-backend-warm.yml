name: Keep backend warm

# Paused. Kept because it is the fix if the backend is ever moved back to a
# platform that spins containers down when idle (Render's free tier did, after
# ~15 minutes: the next request then paid a full cold boot -- Python + torch +
# sentence-transformers + catalogue load -- which measured as ~14s health
# checks and 60s+ searches). Railway runs a persistent container, so this is
# not currently needed.
#
# To re-enable: uncomment the schedule below and point the URL at the backend
# that needs keeping warm.
on:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -f -s -m 30 https://shopping-assist-production.up.railway.app/api/v1/health
